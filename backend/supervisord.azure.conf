; Runs redis-server + FastAPI (uvicorn) + Celery worker + Celery beat as
; four processes inside one container, matching how the single-user
; version of this app already runs on Azure App Service — no sidecars,
; no Deployment Center conflicts. Only used by Dockerfile.azure; the VM
; deployment (Dockerfile/docker-compose.yml) runs these as separate
; containers instead.
;
; Queue names below (`calls,default`) match THIS project's
; app/core/celery_app.py task_queues — don't copy the single-user app's
; queue list verbatim if it differs, or the worker sits there consuming
; queues nothing routes to.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

[program:redis]
command=redis-server --save "" --appendonly no
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
; --workers 1, not 2 — this box is now also running Redis + a Celery
; worker + Celery beat alongside FastAPI, all sharing the same B2 (2
; vCPU/3.5GB). The `--workers 2` used in the VM's plain Dockerfile
; assumed FastAPI had the whole container to itself; here it doesn't.
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
directory=/app
autostart=true
autorestart=true
priority=10
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=celery -A app.core.celery_app worker --loglevel=info -Q calls,default -c 2
directory=/app
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:beat]
command=celery -A app.core.celery_app beat --loglevel=info
directory=/app
autostart=true
autorestart=true
priority=30
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
